<!DOCTYPE html>
<html lang="ko">
<head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-CQQNZC7MSQ"></script>
<script>
  window.dataLayer = window.dataLayer || [];

  gtag('config', 'G-CQQNZC7MSQ');

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>페이지를 찾을 수 없습니다 | 건강노트</title>
<meta name="robots" content="noindex, follow">
<link href="/style.css" rel="stylesheet">
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background-color: #f8fafc;
    color: #1e293b;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  .error-container {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }
  .error-card {
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    border: 1px solid #e2e8f0;
    max-width: 480px;
    width: 100%;
    padding: 48px 32px;
    text-align: center;
  }
  .error-code {
    font-size: 4rem;
    font-weight: 800;
    color: #2563eb;
    margin: 0 0 12px;
    line-height: 1;
  }
  .error-title {
    font-size: 1.4rem;
    font-weight: 700;
    margin: 0 0 16px;
    color: #0f172a;
  }
  .error-desc {
    font-size: 0.98rem;
    color: #64748b;
    line-height: 1.6;
    margin: 0 0 32px;
  }
  .btn-group {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .btn-primary {
    display: inline-block;
    background-color: #2563eb;
    color: #ffffff;
    font-weight: 600;
    padding: 14px 24px;
    border-radius: 8px;
    text-decoration: none;
    transition: background-color 0.2s;
  }
  .btn-primary:hover {
    background-color: #1d4ed8;
  }
  .btn-secondary {
    display: inline-block;
    background-color: #f1f5f9;
    color: #334155;
    font-weight: 600;
    padding: 14px 24px;
    border-radius: 8px;
    text-decoration: none;
    transition: background-color 0.2s;
  }
  .btn-secondary:hover {
    background-color: #e2e8f0;
  }
</style>
</head>
<body>
  <div class="error-container">
    <div class="error-card">
      <div class="error-code">404</div>
      <h1 class="error-title">페이지를 찾을 수 없습니다</h1>
      <p class="error-desc">
        요청하신 페이지가 삭제되었거나 주소가 잘못 입력되었습니다.<br>
        아래 버튼을 통해 건강노트 메인 홈이나 블로그 칼럼으로 이동해 보세요.
      </p>
      <div class="btn-group">
        <a href="/" class="btn-primary">홈으로 돌아가기</a>
        <a href="/blog" class="btn-secondary">건강 칼럼 블로그 보기</a>
      </div>
    </div>
  </div>
</body>
</html>
